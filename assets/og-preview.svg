<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090e" />
      <stop offset="50%" stop-color="#0f1424" />
      <stop offset="100%" stop-color="#080a12" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.05)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.01)" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Ambient Glow Orbs -->
  <circle cx="150" cy="120" r="220" fill="#00f2fe" opacity="0.12" filter="url(#glow)" />
  <circle cx="1050" cy="480" r="280" fill="#a855f7" opacity="0.12" filter="url(#glow)" />
  <circle cx="850" cy="180" r="160" fill="#3b82f6" opacity="0.1" filter="url(#glow)" />

  <!-- Grid lines -->
  <g stroke="rgba(255, 255, 255, 0.04)" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="0" y1="500" x2="1200" y2="500" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Main Card Container -->
  <rect x="80" y="80" width="1040" height="470" rx="24" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" />

  <!-- Top Badge -->
  <rect x="130" y="130" width="220" height="38" rx="19" fill="rgba(0, 242, 254, 0.1)" stroke="#00f2fe" stroke-width="1" />
  <circle cx="150" cy="149" r="5" fill="#10b981" />
  <text x="168" y="154" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#00f2fe" letter-spacing="1">
    PORTFOLIO &amp; SHOWCASE
  </text>

  <!-- Main Heading Name -->
  <text x="130" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
    SARAVANESH D S
  </text>

  <!-- Subtitle -->
  <text x="130" y="295" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="600" fill="url(#primaryGrad)">
    B.E. Computer Science &amp; Engineering | AI/ML &amp; Software Developer
  </text>

  <!-- College & Focus -->
  <text x="130" y="345" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400" fill="#94a3b8">
    Chennai Institute of Technology • AI/ML • Full-Stack Prototyping • Cybersecurity
  </text>

  <!-- Tagline Quote -->
  <rect x="130" y="380" width="940" height="70" rx="12" fill="rgba(15, 23, 42, 0.6)" stroke="rgba(255, 255, 255, 0.08)" />
  <text x="160" y="422" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-style="italic" fill="#cbd5e1">
    "Building. Learning. Innovating."
  </text>

  <!-- Pills Footer -->
  <g transform="translate(130, 475)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="160" height="34" rx="17" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)" />
    <text x="80" y="22" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#f8fafc">AI / Machine Learning</text>
    
    <!-- Pill 2 -->
    <rect x="175" y="0" width="170" height="34" rx="17" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)" />
    <text x="260" y="22" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#f8fafc">Public Bus Tracking AI</text>

    <!-- Pill 3 -->
    <rect x="360" y="0" width="190" height="34" rx="17" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)" />
    <text x="455" y="22" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#f8fafc">AI Media Authenticity</text>

    <!-- Pill 4 -->
    <rect x="565" y="0" width="160" height="34" rx="17" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)" />
    <text x="645" y="22" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#f8fafc">Web Engineering</text>
  </g>
</svg>
