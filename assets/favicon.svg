<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Background Hexagon/Rounded Shield -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="#0c0e17" stroke="url(#glowGrad)" stroke-width="2.5" filter="url(#glow)" />
  <!-- Subtle inner circuit accent -->
  <circle cx="12" cy="12" r="2" fill="#00f2fe" opacity="0.8" />
  <circle cx="52" cy="52" r="2" fill="#8b5cf6" opacity="0.8" />
  <path d="M12 12 L20 12 L24 16" stroke="#00f2fe" stroke-width="1" stroke-linecap="round" opacity="0.4" />
  <!-- Monogram SDS -->
  <text x="50%" y="54%" text-anchor="middle" dominant-baseline="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="22" font-weight="900" fill="url(#glowGrad)" letter-spacing="1.5">
    SDS
  </text>
</svg>
